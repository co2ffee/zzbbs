name: Build and release deploy jar

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build jar
        run: mvn -B clean package -DskipTests

      - name: Rename jar for stable download url
        run: cp target/pybbs-*.jar pybbs.jar

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete deploy-latest --yes --cleanup-tag || true
          gh release create deploy-latest pybbs.jar \
            --title "Latest deploy build" \
            --notes "Built from commit ${{ github.sha }}"
