name: Auto merge Claude PRs

# 云端 AI 的后端 PR：测试(test) + 构建(build) + GitGuardian 都通过后自动合并，并触发发布构建；
# 服务器的 auto-deploy-backend 定时器随后自动下载新 jar、重启、健康检查（约 10 分钟内），失败自动回滚旧 jar。
#  - 只处理同仓库、分支名以 claude/ 开头、非 draft 的 PR（fork 的 PR 不处理）
#  - 改了 .github/ 下文件的 PR 不自动合并，需要人工合并
#  - 停用：删除本文件，或把仓库 Actions 变量 AUTO_MERGE_DISABLED 设为 true
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ master ]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  merge:
    if: >-
      vars.AUTO_MERGE_DISABLED != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Refuse PRs that touch .github/
        run: |
          if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -q '^\.github/'; then
            echo "PR 改了 .github/ 下的文件，不自动合并，需要人工合并"; exit 1
          fi

      # 等 test、build、GitGuardian 三项都出现并成功（最多 20 分钟）
      - name: Wait for required checks
        run: |
          for i in $(seq 1 80); do
            ok=1
            for n in "test" "build" "GitGuardian"; do
              c=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
                    --jq "[.check_runs[] | select(.name | test(\"^${n}\"))][0] | \"\(.status) \(.conclusion)\"" 2>/dev/null || true)
              case "$c" in
                "completed success"|"completed neutral") ;;
                completed*) echo "$n 未通过($c)，不合并"; exit 1 ;;
                *) ok=0; echo "$n: ${c:-未出现}" ;;
              esac
            done
            [ "$ok" = 1 ] && { echo "检查全部通过"; exit 0; }
            sleep 15
          done
          echo "20 分钟内检查没有全部通过，不合并"; exit 1

      - name: Merge
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$SHA"

      # 用 GITHUB_TOKEN 合并不会触发 push 事件，所以手动触发发布构建
      - name: Trigger release build
        run: gh workflow run release-jar.yml --repo "$GITHUB_REPOSITORY" --ref master
